*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#f7f8f6;line-height:1.6}

.bottom{background:var(--navy);color:#d0d9df;padding:28px 0}.bottom-inner{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.bottom a{color:white;text-decoration:none;font-weight:700}.bottom .button{background:linear-gradient(110deg,var(--orange),var(--red));padding:12px 18px;border-radius:999px;color:white}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header-inner{padding:10px 0}.nav{gap:14px;flex-wrap:wrap;justify-content:flex-end}.nav a{font-size:13px}}
